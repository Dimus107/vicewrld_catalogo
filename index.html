<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Syne:wght@700;800&family=Anton&family=Caveat:wght@600;700&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#fff;--mist:#f5f5f6;--fog:#e6e6ea;--edge:#cfcfd6;--ink:#15161a;--muted:#6b6b73;--accent:#2340f0;--accent-deep:#1a2fc2;--danger:#d0283b;
--ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--display:'Syne','Instrument Sans',system-ui,sans-serif;--wrap:1240px;--pad:max(20px,calc((100% - var(--wrap))/2 + 24px))}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:84px}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0)}
button{font-family:inherit;cursor:pointer}img{display:block}a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.h{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:.94;margin:0}
/* anuncio */
.ann{background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;text-align:center;padding:9px 16px;padding-top:calc(9px + env(safe-area-inset-top,0px));min-height:36px}
.ann span{display:block;animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* nav */
.nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--fog);padding:12px var(--pad);display:flex;align-items:center;gap:22px}
.logo{height:24px;width:auto;filter:brightness(0)}
.links{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links button{background:none;border:0;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;color:var(--ink);white-space:nowrap}
.links button:hover{background:var(--mist)}.links button.on{background:var(--ink);color:#fff}
.cartbtn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:600;white-space:nowrap}
.cartbtn b{background:var(--accent);border-radius:999px;font-size:11.5px;padding:1px 8px;min-width:20px;text-align:center}
.cartbtn.none b{display:none}
/* hero */
.hero{position:relative;overflow:hidden;margin:16px var(--pad) 0;border-radius:26px}
.slides{display:flex;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.slide{min-width:100%;display:grid;grid-template-columns:1.05fr 1fr;min-height:min(560px,72vh);align-items:stretch}
.s-txt{padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:18px;align-items:flex-start}
.s-tag{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;border:1.5px solid currentColor}
.s-txt h2{font-size:clamp(40px,7vw,92px)}
.s-txt p{margin:0;font-size:clamp(15px,1.6vw,18px);line-height:1.5;max-width:440px;opacity:.88}
.slide[data-g]{cursor:pointer}
.s-cta{color:inherit;border:0;border-radius:999px;padding:15px 28px;font-size:15px;font-weight:700;background:currentColor}
.s-cta span{color:var(--sbg)}
.s-img{position:relative;overflow:hidden}
.s-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.s-img img.fit{object-fit:contain}.s-img:has(.fit){background:#fff}
.s-cd{display:flex;gap:10px;font-family:var(--display);font-weight:800;font-size:22px}
.s-cd i{font-style:normal;background:rgba(255,255,255,.16);border-radius:10px;padding:8px 10px;min-width:54px;text-align:center}
.s-cd small{display:block;font:600 10px var(--ui);opacity:.75}
.hnav{position:absolute;left:clamp(22px,5vw,64px);bottom:26px;display:flex;justify-content:flex-start;gap:8px;align-items:center}

  else if(k==='cmleft'||k==='cmright'||k==='cmfirst'){var F=SITE.fotos,j=k==='cmleft'?i-1:k==='cmright'?i+1:0;if(j<0||j>=F.length||j===i)return;var it=F.splice(i,1)[0];F.splice(j,0,it);persist();renderAll();editSite()}
  else if(k==='cmdel'){SITE.fotos.splice(i,1);persist();renderAll();editSite()}
  else if(k==='bk'){var bb=new Blob([JSON.stringify(S)],{type:'application/json'}),ba=document.createElement('a');ba.href=URL.createObjectURL(bb);ba.download='vicewrld-copia-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(ba);ba.click();ba.remove();toast('Copia guardada en tus descargas: guárdala en un lugar seguro')}
  else if(k==='bkload'){var bf=document.createElement('input');bf.type='file';bf.accept='.json,.html,application/json,text/html';bf.onchange=function(){if(!bf.files[0])return;var r=new FileReader();r.onload=function(){try{var x=r.result,o;if(x.trim().charAt(0)==='<'){var m=x.match(/<script id="seed" type="application\/json">([\s\S]*?)<\/script>/);o=JSON.parse(m[1])}else o=JSON.parse(x);if(!o.products||!o.products.length)throw 0;S=o;S.site=S.site||DEF_SITE;S.cats=S.cats||DEF_CATS;fill();bind();persist();renderAll();var ext=P.filter(function(p){return p.images[0]&&p.images[0].indexOf('data:')!==0}).length;toast('Copia cargada: '+P.length+' prendas'+(ext?'. '+ext+' fotos son archivos de la carpeta img y no se verán aquí':''))}catch(e){toast('No pude leer ese archivo')}};r.readAsText(bf.files[0])};bf.click()}
  else if(k==='plink'){var pl=plink(prod());try{navigator.clipboard.writeText(pl).then(function(){toast('Link copiado')},function(){toast(pl)})}catch(e){toast(pl)}}
  else if(k==='wimg')pickImg(1400,.88,function(d){SITE.welcome=d;persist();showWelcome();if(em.classList.contains('show'))editSite()});
  else if(k==='wdel'){SITE.welcome='';persist();showWelcome();if(em.classList.contains('show'))editSite()}
  else if(k==='cup'||k==='cdn'){var j=i+(k==='cup'?-1:1),C=S.cats;if(j<0||j>=C.length)return;var y=C[i];C[i]=C[j];C[j]=y;changed();if(em.classList.contains('show'))editSite()}
  else if(k==='cdel'){var c=S.cats[i];if(P.some(function(p){return p.category===c.key})){toast('Primero mueve sus prendas a otra categoría');return}S.cats.splice(i,1);changed();editSite()}});
}
